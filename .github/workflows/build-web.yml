name: Build Browser Version

on:
  push:
    paths:
      - '.websrc/**'
      - '.demo-src/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble verified Web source
        shell: bash
        run: |
          set -euxo pipefail
          cat .websrc/part-*.b64 | base64 -d > websrc.tar.xz
          echo 'fae5cfd15d4494fe9592cb08cd4640b3a452f5d80230ddb979a63be79db0a19c  websrc.tar.xz' | sha256sum -c -
          rm -rf project
          mkdir project
          tar -xJf websrc.tar.xz -C project --strip-components=1
          echo "BASE_PROJECT_SIZE=$(du -sh project | cut -f1)"
          if test -f project/assets/pbr/floor_tiles_albedo.png; then echo HAS_PBR=YES; else echo HAS_PBR=NO; fi
          if test -f project/assets/audio/lab_hum.wav; then echo HAS_AUDIO=YES; else echo HAS_AUDIO=NO; fi

      - name: Overlay current demo source
        shell: bash
        run: |
          set -euxo pipefail
          if test -d .demo-src; then
            cp -a .demo-src/. project/
          fi

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot
          GODOT="$(find godot -type f -name '*x86_64' | head -1)"
          chmod +x "$GODOT"
          echo "GODOT=$PWD/$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Install official Godot 4.7.1 Web template
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          DEST="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$DEST"
          unzip -p templates.tpz 'templates/web_nothreads_release.zip' > "$DEST/web_nothreads_release.zip"
          ls -lh "$DEST/web_nothreads_release.zip"

      - name: Configure non-threaded Web export
        shell: bash
        run: |
          cat > project/export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=true
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          EOF

      - name: Import and export browser game
        shell: bash
        run: |
          set -euxo pipefail
          "$GODOT" --headless --path project --editor --quit
          rm -rf web
          mkdir web
          "$GODOT" --headless --path project --export-release Web "$PWD/web/index.html"
          test -s web/index.html
          test -s web/index.js
          test -s web/index.wasm
          test -s web/index.pck
          grep -q 'Specimen Care: Gloop Demo' project/project.godot
          ls -lh web

      - name: Commit generated browser build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "TVGSDVLGames"
          git config user.email "TVGSDVLGames@users.noreply.github.com"
          git add -f web
          if git diff --cached --quiet; then
            echo 'Browser build already current.'
          else
            git commit -m 'Build Experiment J-7701 browser demo'
            git push
          fi
