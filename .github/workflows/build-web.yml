name: Build Experiment J-7701 Browser Demo

on:
  push:
    paths:
      - '.websrc/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble verified browser source
        shell: bash
        run: |
          set -euxo pipefail
          cat .websrc/part-*.b64 | base64 -d > websrc.tar.xz
          echo 'fae5cfd15d4494fe9592cb08cd4640b3a452f5d80230ddb979a63be79db0a19c  websrc.tar.xz' | sha256sum -c -
          rm -rf project
          mkdir project
          tar -xJf websrc.tar.xz -C project --strip-components=1

      - name: Apply current demo delta
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://gloop-demo-delta-fs024e4hx-tvhsdvlgames.vercel.app'
          : > demo.delta
          for i in $(seq -w 0 10); do
            curl -fsSL --retry 5 --retry-delay 2 "$BASE/part-$i" >> demo.delta
          done
          echo "staged bytes: $(wc -c < demo.delta)"
          if head -c 5 demo.delta | grep -q '^/Td6W'; then
            base64 -d demo.delta > demo.patch.xz
          else
            mv demo.delta demo.patch.xz
          fi
          echo 'd4a563e7b519dfcda5f0614516ab556b85784d36a2ebcc0851915170f2155d46  demo.patch.xz' | sha256sum -c -
          xz -dc demo.patch.xz > demo.patch
          echo 'e4dc8df072599402662937b9aa71d253a7bccbdaa2d359edd7afcf44e85f448b  demo.patch' | sha256sum -c -
          patch -d project -p1 < demo.patch
          grep -q 'Specimen Care - Gloop Demo' project/project.godot
          test -s project/scripts/mobile_controls.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot
          GODOT="$(find godot -type f -name '*x86_64' | head -1)"
          chmod +x "$GODOT"
          echo "GODOT=$PWD/$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Install official Godot 4.7.1 Web templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          DEST="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$DEST"
          unzip -p templates.tpz 'templates/web_nothreads_release.zip' > "$DEST/web_nothreads_release.zip"
          unzip -p templates.tpz 'templates/web_nothreads_debug.zip' > "$DEST/web_nothreads_debug.zip"

      - name: Configure non-threaded Web export
        shell: bash
        run: |
          cat > project/export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=true
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include="<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no\">"
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=true
          progressive_web_app/ensure_cross_origin_isolation_headers=false
          progressive_web_app/display=1
          progressive_web_app/orientation=0
          progressive_web_app/icon_144x144=""
          progressive_web_app/icon_180x180=""
          progressive_web_app/icon_512x512=""
          progressive_web_app/background_color=Color(0.008, 0.014, 0.018, 1)
          progressive_web_app/offline_page=""
          EOF

      - name: Import and export browser demo
        shell: bash
        run: |
          set -euxo pipefail
          "$GODOT" --headless --path project --editor --quit
          rm -rf web
          mkdir web
          "$GODOT" --headless --path project --export-release Web "$PWD/web/index.html"
          test -s web/index.html
          test -s web/index.js
          test -s web/index.wasm
          test -s web/index.pck
          grep -q 'Specimen Care - Gloop Demo' project/project.godot
          ls -lh web

      - name: Commit generated browser build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "TVGSDVLGames"
          git config user.email "TVGSDVLGames@users.noreply.github.com"
          git add -f web
          if git diff --cached --quiet; then
            echo 'Browser build already current.'
          else
            git commit -m 'Build Experiment J-7701 browser demo'
            git push
          fi
