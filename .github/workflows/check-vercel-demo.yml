name: Verify Experiment J-7701 Vercel

on:
  push:
    paths:
      - '.github/workflows/check-vercel-demo.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment build
        run: sleep 90
      - name: Check public files
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://experiment-j7701-7up47vwcx-tvhsdvlgames.vercel.app'
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/index.html "$BASE/"
          grep -q 'Experiment J-7701' /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/index.pck "$BASE/index.pck"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/index.wasm "$BASE/index.wasm"
          PCK=$(stat -c %s /tmp/index.pck)
          WASM=$(stat -c %s /tmp/index.wasm)
          echo "VERCEL_DEMO_HTTP_OK pck=$PCK wasm=$WASM"
          test "$PCK" -gt 1000000
          test "$WASM" -gt 30000000
