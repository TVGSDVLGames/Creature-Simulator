name: Verify Creature Vercel Now
on:
  push:
    branches: [vercel-demo]
    paths:
      - '.github/workflows/verify-creature-vercel-now.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live production is the mobile build
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://creature-simulator-play-tvhsdvlgames.vercel.app'
          curl -fsSL --retry 8 --retry-delay 3 -o /tmp/live.html "$BASE/"
          curl -fsSL --retry 8 --retry-delay 3 -o /tmp/live.pck "$BASE/index.pck"
          grep -q 'Experiment J-7701' /tmp/live.html
          LOCAL_SHA=$(sha256sum web/index.pck | awk '{print $1}')
          LIVE_SHA=$(sha256sum /tmp/live.pck | awk '{print $1}')
          echo "LOCAL=$LOCAL_SHA LIVE=$LIVE_SHA"
          test "$LIVE_SHA" = "$LOCAL_SHA"
          echo 'VERCEL_MOBILE_BUILD_VERIFIED'
