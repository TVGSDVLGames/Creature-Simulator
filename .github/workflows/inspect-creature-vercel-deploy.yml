name: Inspect Creature Vercel Deploy
on:
  push:
    branches: [vercel-demo]
    paths:
      - '.github/workflows/inspect-creature-vercel-deploy.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect possible production aliases
        shell: bash
        run: |
          set +e
          for BASE in \
            'https://creature-simulator-play-lh3rdr8cy-tvhsdvlgames.vercel.app' \
            'https://creature-simulator-play-tvhsdvlgames.vercel.app' \
            'https://creature-simulator-play.vercel.app' \
            'https://experiment-j7701.vercel.app' \
            'https://experiment-j7701-tvhsdvlgames.vercel.app' \
            'https://creature-simulator.vercel.app'; do
            echo "=== $BASE ==="
            curl -sSI --max-time 12 "$BASE/" | grep -Ei 'HTTP/|location:|content-type:|x-vercel-id:' | head -12
            curl -sSL --max-time 15 "$BASE/" -o /tmp/root.html
            echo "root_bytes=$(stat -c%s /tmp/root.html 2>/dev/null)"
            grep -o '<title>[^<]*</title>' /tmp/root.html | head -1
          done
