<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quest WebXR Hosting Check</title><style>body{font-family:system-ui;background:#111821;color:#edf4ff;max-width:700px;margin:8vh auto;padding:24px}output{display:block;white-space:pre-line;background:#263345;padding:20px;border-radius:10px;line-height:1.7}button{padding:14px 22px;border:0;border-radius:8px;background:#3876df;color:white;font-size:17px}button:disabled{opacity:.45}</style></head><body><h1>Quest 3: WebXR Hosting Check</h1><p>This checks whether a hosted page can start an immersive VR session on your Quest. Open it in the Meta Quest Browser.</p><output id="status">Checking device support...</output><p><button id="enter" disabled>Enter VR test</button></p><p id="help">This page uses no external assets or libraries.</p><canvas hidden id="gl"></canvas><script>
let s=null,g=null;const out=document.getElementById('status'),button=document.getElementById('enter'),help=document.getElementById('help'),cv=document.getElementById('gl');
(async()=>{const lines=['Secure connection: '+(isSecureContext?'YES':'NO'),'WebXR API: '+(navigator.xr?'YES':'NO')];if(navigator.xr){for(const mode of ['immersive-vr','immersive-ar'])try{const ok=await navigator.xr.isSessionSupported(mode);lines.push(mode+': '+(ok?'SUPPORTED':'not supported'));if(mode==='immersive-vr')button.disabled=!ok}catch(e){lines.push(mode+': '+e.message)}}out.textContent=lines.join('\n')})();
function draw(t,f){if(!s)return;const p=f.getViewerPose(ref);s.requestAnimationFrame(draw);if(!p)return;g.bindFramebuffer(g.FRAMEBUFFER,s.renderState.baseLayer.framebuffer);for(const view of p.views){const v=s.renderState.baseLayer.getViewport(view);g.viewport(v.x,v.y,v.width,v.height);g.clearColor(.06,.12,.20,1);g.clear(g.COLOR_BUFFER_BIT)}}
let ref;
button.onclick=async()=>{try{button.disabled=true;g=cv.getContext('webgl',{xrCompatible:true});if(!g)throw Error('WebGL unavailable');await g.makeXRCompatible();s=await navigator.xr.requestSession('immersive-vr');s.updateRenderState({baseLayer:new XRWebGLLayer(s,g)});ref=await s.requestReferenceSpace('local');s.addEventListener('end',()=>{s=null;button.disabled=false;help.textContent='VR session exited successfully.'});help.textContent='VR session started. Use the Quest exit control to return.';s.requestAnimationFrame(draw)}catch(e){out.textContent+='\nVR launch error: '+e.message;button.disabled=false}};
</script></body></html>
